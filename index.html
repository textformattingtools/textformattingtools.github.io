<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Formatting Tools - Premium Studio</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts for premium appearance -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>

    <header class="app-header">
        <div class="logo">textformattingtools</div>
        <div class="badge">v2.0 Stable</div>
    </header>

    <main class="workspace-container">
        <!-- Control Dashboard Grid Container -->
        <section class="tools-panel">
            <h2 class="panel-title">Transformation Tools</h2>
            
            <div class="tools-group">
                <h3>Standard Conversions</h3>
                <div class="button-grid">
                    <button class="case-btn active" data-case="lowercase">lowercase</button>
                    <button class="case-btn" data-case="uppercase">UPPERCASE</button>
                    <button class="case-btn" data-case="title">Title Case</button>
                    <button class="case-btn" data-case="sentence">Sentence case</button>
                    <button class="case-btn" data-case="capitalize">Capitalize Words</button>
                </div>
            </div>

            <div class="tools-group">
                <h3>Developer Cases</h3>
                <div class="button-grid">
                    <button class="case-btn" data-case="camel">camelCase</button>
                    <button class="case-btn" data-case="pascal">PascalCase</button>
                    <button class="case-btn" data-case="snake">snake_case</button>
                    <button class="case-btn" data-case="kebab">kebab-case</button>
                </div>
            </div>

            <div class="workspace-actions">
                <button id="clear-btn" class="action-btn secondary">Clear Workspace</button>
            </div>
        </section>

        <!-- Twin Text Editors Section -->
        <section class="editors-panel">
            <div class="editor-box">
                <div class="editor-header">
                    <span>Input Source</span>
                    <div class="counters">
                        <span>Words: <strong id="word-count">0</strong></span>
                        <span>Chars: <strong id="char-count">0</strong></span>
                    </div>
                </div>
                <textarea id="input-text" placeholder="Paste or type your raw text content here..."></textarea>
            </div>

            <div class="editor-box">
                <div class="editor-header">
                    <span>Formatted Output</span>
                    <button id="copy-btn" class="action-btn primary">Copy Output</button>
                </div>
                <textarea id="output-text" readonly placeholder="Your formatted text will automatically display here..."></textarea>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
