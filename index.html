<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Utilities Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Text Utilities & Formatting Hub</h1>
        <p>Fast, secure, browser-based text manipulation tools.</p>
    </header>

    <main class="container">
        <div class="input-area">
            <textarea id="textInput" placeholder="Paste or type your text here..."></textarea>
            <div class="stats">
                <span>Words: <strong id="wordCount">0</strong></span> | 
                <span>Characters: <strong id="charCount">0</strong></span>
            </div>
        </div>

        <div class="toolbar">
            <button onclick="transformText('upper')">UPPERCASE</button>
            <button onclick="transformText('lower')">lowercase</button>
            <button onclick="transformText('clean')">Clean Whitespace</button>
            <button onclick="copyToClipboard()" class="btn-copy">Copy Result</button>
            <button onclick="clearText()" class="btn-clear">Clear</button>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
